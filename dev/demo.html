<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ubiquiti Network Dashboard – Vorschau</title>
    <style>
      body { max-width: 1280px; margin: 0 auto; padding: 24px; background: #12202a; font-family: system-ui, sans-serif; }
      ha-icon { display: inline-grid; place-items: center; font-size: 12px; }
    </style>
  </head>
  <body>
    <ha-ubiquiti-dashboard></ha-ubiquiti-dashboard>
    <script type="module">
      customElements.define("ha-icon", class extends HTMLElement {
        connectedCallback() { this.textContent = "◈"; }
      });
      import "../src/ha-ubiquiti-dashboard.js";
      const card = document.querySelector("ha-ubiquiti-dashboard");
      card.hass = {
        states: {
          "sensor.dachboden_state": { state: "online", attributes: {} },
          "sensor.dachboden_clients": { state: "4", attributes: {} },
          "sensor.obergeschoss_state": { state: "online", attributes: {} },
          "sensor.obergeschoss_clients": { state: "13", attributes: {} },
          "switch.dachboden_port_1": { state: "on", attributes: {} },
          "switch.dachboden_port_2": { state: "on", attributes: {} },
          "switch.dachboden_port_3": { state: "on", attributes: {} },
          "switch.dachboden_port_4": { state: "on", attributes: {} },
          "switch.dachboden_port_5": { state: "on", attributes: {} },
          "sensor.dachboden_port_1_speed": { state: "1000", attributes: {} },
          "sensor.dachboden_port_2_speed": { state: "1000", attributes: {} },
          "sensor.dachboden_port_3_speed": { state: "1000", attributes: {} },
          "sensor.dachboden_port_4_speed": { state: "1000", attributes: {} },
          "sensor.dachboden_port_5_speed": { state: "1000", attributes: {} },
          "sensor.heating_state": { state: "online", attributes: {} },
          "switch.heating_port_1": { state: "on", attributes: {} },
          "switch.heating_port_2": { state: "on", attributes: {} },
          "switch.heating_port_3": { state: "on", attributes: {} },
          "switch.heating_port_4": { state: "on", attributes: {} },
          "switch.heating_port_5": { state: "on", attributes: {} },
          "switch.heating_port_6": { state: "on", attributes: {} },
          "switch.heating_port_7": { state: "on", attributes: {} },
          "switch.heating_port_8": { state: "on", attributes: {} },
          "binary_sensor.udm_wan_status": { state: "on", attributes: {} },
          "sensor.udm_wan_ip": { state: "203.0.113.42", attributes: {} },
          "sensor.udm_wan_download": { state: "412", attributes: { unit_of_measurement: "Mbit/s" } },
          "sensor.udm_wan_upload": { state: "89", attributes: { unit_of_measurement: "Mbit/s" } },
          "sensor.udm_wan_latency": { state: "11", attributes: { unit_of_measurement: "ms" } },
          "switch.udm_port_1": { state: "on", attributes: {} }
        }
      };
      card.setConfig({
        title: "UniFi Network",
        access_points: [
          { name: "Dachboden AP", status_entity: "sensor.dachboden_state", clients_entity: "sensor.dachboden_clients", uplink: { switch: "Heizungsraum", port: 2 } },
          { name: "Obergeschoss AP", model: "Ubiquiti U7 Pro Max", status_entity: "sensor.obergeschoss_state", clients_entity: "sensor.obergeschoss_clients", uplink: { switch: "Heizungsraum", port: 7 } }
        ],
        switches: [
          {
            name: "Dachboden",
            status_entity: "sensor.dachboden_state",
            uplink: { switch: "Heizungsraum", port: 3, local_port: 1 },
            ports: [
              { number: 1, name: "Heizungsraum Uplink", status_entity: "switch.dachboden_port_1", speed_entity: "sensor.dachboden_port_1_speed" },
              { number: 2, name: "Dachgeschoss - U7 Lite", status_entity: "switch.dachboden_port_2", speed_entity: "sensor.dachboden_port_2_speed" },
              { number: 3, name: "Proxmox", status_entity: "switch.dachboden_port_3", speed_entity: "sensor.dachboden_port_3_speed" },
              { number: 4, name: "Nicht zugeordnet", status_entity: "switch.dachboden_port_4", speed_entity: "sensor.dachboden_port_4_speed" },
              { number: 5, name: "iLO - Server", status_entity: "switch.dachboden_port_5", speed_entity: "sensor.dachboden_port_5_speed" }
            ]
          },
          {
            name: "Heizungsraum",
            status_entity: "sensor.heating_state",
            uplink: { switch: "Internet-Gateway", port: 1, local_port: 8 },
            ports: [
              { number: 1, name: "SONOFF CAM-B1P", status_entity: "switch.heating_port_1" },
              { number: 2, name: "Dachboden AP", status_entity: "switch.heating_port_2" },
              { number: 3, name: "Dachboden Switch Uplink", status_entity: "switch.heating_port_3" },
              { number: 4, name: "Reolink Kamera", status_entity: "switch.heating_port_4" },
              { number: 5, name: "Gäste-Switch", status_entity: "switch.heating_port_5" },
              { number: 6, name: "SONOFF", status_entity: "switch.heating_port_6" },
              { number: 7, name: "Obergeschoss AP", status_entity: "switch.heating_port_7" },
              { number: 8, name: "Internet-Gateway Uplink", status_entity: "switch.heating_port_8" }
            ]
          }
        ],
        gateway: {
          name: "Internet-Gateway",
          model: "UDM Pro",
          status_entity: "binary_sensor.udm_wan_status",
          wan_ip_entity: "sensor.udm_wan_ip",
          download_entity: "sensor.udm_wan_download",
          upload_entity: "sensor.udm_wan_upload",
          latency_entity: "sensor.udm_wan_latency",
          ports: [
            { number: 1, name: "Heizungsraum", status_entity: "switch.udm_port_1" }
          ]
        }
      });
    </script>
  </body>
</html>
